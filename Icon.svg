<svg width="640" height="460" viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ===== Card background ===== -->
  <rect x="10" y="10" width="620" height="440" rx="14" fill="#0d1117" stroke="#2ea043" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Title bar ===== -->
  <circle cx="35" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="55" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="75" cy="34" r="6" fill="#27c93f"/>
  <text x="320" y="39" text-anchor="middle" font-size="13" fill="#5fd75f">0xL3on@toolkit</text>
  <line x1="26" y1="52" x2="614" y2="52" stroke="#1f6b2f" stroke-width="1"/>

  <!-- ===== Typing animation ===== -->
  <g>
    <clipPath id="cp1"><rect x="171.8" y="76" width="0" height="36"><animate attributeName="width" dur="20s" repeatCount="indefinite" fill="freeze" keyTimes="0;0.075;0.175;0.225;1" values="0;296;296;0;0"/></rect></clipPath>
    <clipPath id="cp2"><rect x="242" y="76" width="0" height="36"><animate attributeName="width" dur="20s" repeatCount="indefinite" fill="freeze" keyTimes="0;0.25;0.325;0.425;0.475;1" values="0;0;156;156;0;0"/></rect></clipPath>
    <clipPath id="cp3"><rect x="218.6" y="76" width="0" height="36"><animate attributeName="width" dur="20s" repeatCount="indefinite" fill="freeze" keyTimes="0;0.5;0.575;0.675;0.725;1" values="0;0;202.8;202.8;0;0"/></rect></clipPath>
    <clipPath id="cp4"><rect x="242" y="76" width="0" height="36"><animate attributeName="width" dur="20s" repeatCount="indefinite" fill="freeze" keyTimes="0;0.75;0.825;0.925;0.975;1" values="0;0;156;156;0;0"/></rect></clipPath>

    <text x="171.8" y="98" font-size="26" fill="#39ff88" clip-path="url(#cp1)">Penetration Tester</text>
    <text x="242"   y="98" font-size="26" fill="#39ff88" clip-path="url(#cp2)">CTF Player</text>
    <text x="218.6" y="98" font-size="26" fill="#39ff88" clip-path="url(#cp3)">CSE Undergrad</text>
    <text x="242"   y="98" font-size="26" fill="#39ff88" clip-path="url(#cp4)">Red Teamer</text>

    <!-- blinking cursor, jumps to end of whichever phrase is currently "typed" -->
    <rect y="74" width="3" height="28" fill="#39ff88">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x" dur="20s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.075;0.25;0.325;0.5;0.575;0.75;0.825;1"
        values="171.8;468.2;242;398;218.6;421.4;242;398;171.8"/>
    </rect>
  </g>

  <!-- ===== Tool grid (5 x 4) ===== -->
  <g font-size="11.5" fill="#7ee787">
    <!-- row 0 -->
    <g><rect x="26"  y="150" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="80"  y="182" text-anchor="middle">Nmap</text></g>
    <g><rect x="146" y="150" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="200" y="182" text-anchor="middle">Burp Suite</text></g>
    <g><rect x="266" y="150" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="320" y="182" text-anchor="middle">Metasploit</text></g>
    <g><rect x="386" y="150" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="440" y="182" text-anchor="middle">Wireshark</text></g>
    <g><rect x="506" y="150" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="560" y="182" text-anchor="middle">BloodHound</text></g>

    <!-- row 1 -->
    <g><rect x="26"  y="216" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="80"  y="248" text-anchor="middle">Hashcat</text></g>
    <g><rect x="146" y="216" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="200" y="248" text-anchor="middle">John the Ripper</text></g>
    <g><rect x="266" y="216" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="320" y="248" text-anchor="middle">Hydra</text></g>
    <g><rect x="386" y="216" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="440" y="248" text-anchor="middle">SQLMap</text></g>
    <g><rect x="506" y="216" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="560" y="248" text-anchor="middle">Gobuster</text></g>

    <!-- row 2 -->
    <g><rect x="26"  y="282" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="80"  y="314" text-anchor="middle">Aircrack-ng</text></g>
    <g><rect x="146" y="282" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="200" y="314" text-anchor="middle">Mimikatz</text></g>
    <g><rect x="266" y="282" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="320" y="314" text-anchor="middle">Empire</text></g>
    <g><rect x="386" y="282" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="440" y="314" text-anchor="middle">CrackMapExec</text></g>
    <g><rect x="506" y="282" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="560" y="314" text-anchor="middle">Responder</text></g>

    <!-- row 3 -->
    <g><rect x="26"  y="348" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="80"  y="380" text-anchor="middle">Nikto</text></g>
    <g><rect x="146" y="348" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="200" y="380" text-anchor="middle">ffuf</text></g>
    <g><rect x="266" y="348" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="320" y="380" text-anchor="middle">Cobalt Strike</text></g>
    <g><rect x="386" y="348" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="440" y="380" text-anchor="middle">Nessus</text></g>
    <g><rect x="506" y="348" width="108" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/><text x="560" y="380" text-anchor="middle">Kali Linux</text></g>
  </g>

  <text x="320" y="424" text-anchor="middle" font-size="10" fill="#3d5a3f">// arsenal loaded</text>
</svg>
